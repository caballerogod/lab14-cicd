name: Lab 14 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint and Test
    runs-on: self-hosted

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check code with Flake8
        run: python -m flake8 app.py test_app.py

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build and Push
    needs: test
    runs-on: self-hosted

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Configure registry access
        shell: powershell
        run: |
          kubectl create namespace lab14 --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username="${{ github.actor }}" `
            --docker-password="${{ secrets.GITHUB_TOKEN }}" `
            --namespace=lab14 `
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n lab14 --type merge -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}'

      - name: Deploy application
        shell: powershell
        run: |
          kubectl apply -f deployment.yaml
          kubectl set image deployment/lab14-app lab14-app=ghcr.io/${{ github.repository }}:latest -n lab14
          kubectl rollout status deployment/lab14-app -n lab14 --timeout=180s